name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      

      - name: آماده‌سازی ساختار Capacitor و وب‌ویو
        run: |
          mkdir -p www
          cp index.html www/index.html
          
          if [ ! -f package.json ]; then
            npm init -y
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          if [ ! -f capacitor.config.json ]; then
            cat <<EOF > capacitor.config.json
          {
            "appId": "com.rosavibe.panel",
            "appName": "Rosa Panel",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://rosavibe.ir",
              "cleartext": true
            }
          }
          EOF
          fi
          
          npx cap add android || npx cap sync android

      - name: بررسی یا ساخت کلید دائمی (Release Keystore)
        run: |
          if [ -f "rosa-release.keystore" ]; then
            echo "کلید دائمی در مخزن یافت شد. استفاده از کلید ثابت..."
            cp rosa-release.keystore android/app/rosa-release.keystore
          else
            echo "ساخت کلید دائمی جدید..."
            keytool -genkey -v -keystore android/app/rosa-release.keystore \
              -alias rosa_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Iran@8261 -keypass Iran@8261 \
              -dname "CN=RosaPanel, OU=App, O=RosaVibe, L=Tehran, S=Tehran, C=IR"
            cp android/app/rosa-release.keystore ./rosa-release.keystore
          fi

      - name: امضای دیجیتال و ساخت نسخه نهایی (Release APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/rosa-release.keystore \
            -Pandroid.injected.signing.store.password=Iran@8261 \
            -Pandroid.injected.signing.key.alias=rosa_key \
            -Pandroid.injected.signing.key.password=Iran@8261

      - name: آماده‌سازی فایل خروجی
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/RosaPanel-v2.0.0-Release.apk
          cp rosa-release.keystore output/rosa-release.keystore

      - name: آپلود فایل APK و کلید دائمی برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: RosaPanel-Release-Package
          path: output/
